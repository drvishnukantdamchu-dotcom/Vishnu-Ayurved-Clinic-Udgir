name: Apply uploaded clinic branding

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-brand-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update website asset references and hero styling
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('images/vishnu-ayurved-header.jpg', 'images/vishnu-ayurved-header-v2.webp?v=20260925-brand')
          s = s.replace('images/vishnu-ayurved-logo.jpg', 'images/vishnu-ayurved-logo-v2.webp?v=20260925-brand')
          s = s.replace('images/doctor-vishnukant-jadhav-hero-v2.webp?v=20260925-2240', 'images/doctor-vishnukant-jadhav-v3.webp?v=20260925-brand')
          s = s.replace('.doctor-frame img{width:100%;height:600px;object-fit:cover;object-position:center top;border-radius:28px}', '.doctor-frame img{width:100%;height:600px;object-fit:contain;object-position:center bottom;border-radius:28px;background:linear-gradient(180deg,#fffaf0,#edf7f0)}')
          s = s.replace('.topbrand img{width:100%;max-height:190px;object-fit:contain;', '.topbrand img{width:100%;height:auto;max-height:none;object-fit:contain;')
          s = s.replace('@media(max-width:640px){.topbrand img{max-height:115px}', '@media(max-width:640px){.topbrand img{max-height:none}')
          if 'rel="icon"' not in s:
              s = s.replace('</head>', '<link rel="icon" href="images/vishnu-ayurved-logo-v2.webp?v=20260925-brand" type="image/webp">\n</head>')
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/apply-brand-assets.yml

      - name: Commit final branding update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply uploaded logo, header banner and doctor portrait"
          git push

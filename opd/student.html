<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Entry • Vishnu Ayurved</title><meta name="robots" content="noindex,nofollow"><link rel="stylesheet" href="style.css"><style>body{display:block}.student-main{max-width:1000px;margin:auto;padding:24px}#student-work[hidden]{display:none}</style></head><body><main class="student-main"><img src="../images/logo-restored-20260926.webp" alt="Clinic logo" width="72"><h1>Student data entry</h1><p>Register patients and record examination. No prescriptions, clinical approval or full-clinic backup access.</p><section id="student-login-panel"><form id="student-login"><label>Student name<input id="student-name" autocomplete="name" required maxlength="100"></label><button type="submit">Open entry form</button></form><p>Device ID: <code id="student-device">Connecting…</code></p><p id="student-login-status" role="status"></p><a href="./">Doctor / Owner sign-in</a></section><section id="student-work" hidden><button id="student-out">Change student</button><label>Entry by<input id="student-entry-name" maxlength="100" required></label><h2>Register patient</h2><form id="student-registration"><div class="form-grid"><label>Full name *<input name="name" required maxlength="100"></label><label>Age<input name="age" type="number" min="0" max="120"></label><label>Gender<select name="gender"><option value="नोंद नाही">Not recorded</option><option value="स्त्री">Female</option><option value="पुरुष">Male</option><option value="इतर">Other</option></select></label><label>Village<input name="village" maxlength="100"></label><label>Mobile<input name="mobile" type="tel" maxlength="10"></label><label>Visit date<input name="visitDate" type="date" required></label></div><button type="submit">Save patient</button></form><p id="student-save-status" role="status"></p><h2>Patients entered on this device</h2><label>Search name / ID / mobile<input id="student-search" type="search"></label><div id="student-patients"></div><button id="student-sync">Send to doctor / check approval</button><p id="student-cloud-status" role="status"></p></section></main><dialog id="case"><div class="case-toolbar"><strong>Patient examination</strong><button id="student-close" class="close-danger">✕ Close</button></div><div id="case-content"></div></dialog><script type="module" src="student.mjs?v=35"></script></body></html>
